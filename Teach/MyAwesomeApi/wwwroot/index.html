<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise C# & Clean Architecture Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>C# Architecture Dashboard</h1>
            <p>14 Decoupled Lessons Playground</p>
        </div>
        <div class="lesson-list">
            <button class="lesson-item active" data-lesson="1">
                <span class="lesson-number">Lesson 01</span>
                <span class="lesson-title">OOP Introduction</span>
            </button>
            <button class="lesson-item" data-lesson="2">
                <span class="lesson-number">Lesson 02</span>
                <span class="lesson-title">Encapsulation & Properties</span>
            </button>
            <button class="lesson-item" data-lesson="3">
                <span class="lesson-number">Lesson 03</span>
                <span class="lesson-title">Inheritance & Polymorphism</span>
            </button>
            <button class="lesson-item" data-lesson="4">
                <span class="lesson-number">Lesson 04</span>
                <span class="lesson-title">Interfaces & Abstract</span>
            </button>
            <button class="lesson-item" data-lesson="5">
                <span class="lesson-number">Lesson 05</span>
                <span class="lesson-title">Minimal APIs & Middleware</span>
            </button>
            <button class="lesson-item" data-lesson="6">
                <span class="lesson-number">Lesson 06</span>
                <span class="lesson-title">SOLID: SRP, OCP, LSP</span>
            </button>
            <button class="lesson-item" data-lesson="7">
                <span class="lesson-number">Lesson 07</span>
                <span class="lesson-title">SOLID: ISP, DIP</span>
            </button>
            <button class="lesson-item" data-lesson="8">
                <span class="lesson-number">Lesson 08</span>
                <span class="lesson-title">Unit Testing & TDD</span>
            </button>
            <button class="lesson-item" data-lesson="9">
                <span class="lesson-number">Lesson 09</span>
                <span class="lesson-title">DI Lifetimes (Transient/Scoped)</span>
            </button>
            <button class="lesson-item" data-lesson="10">
                <span class="lesson-number">Lesson 10</span>
                <span class="lesson-title">DI Registration (Program.cs)</span>
            </button>
            <button class="lesson-item" data-lesson="11">
                <span class="lesson-number">Lesson 11</span>
                <span class="lesson-title">Clean Architecture Layer</span>
            </button>
            <button class="lesson-item" data-lesson="12">
                <span class="lesson-number">Lesson 12</span>
                <span class="lesson-title">Repository Pattern</span>
            </button>
            <button class="lesson-item" data-lesson="13">
                <span class="lesson-number">Lesson 13</span>
                <span class="lesson-title">CORS Connection</span>
            </button>
            <button class="lesson-item" data-lesson="14">
                <span class="lesson-number">Lesson 14</span>
                <span class="lesson-title">Course wrap-up</span>
            </button>
        </div>
    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div id="active-pane-container" class="content-body">
            <!-- Loaded dynamically via dashboard.js -->
        </div>
    </div>

    <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
